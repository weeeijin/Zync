# Local development overrides — merged automatically by `docker compose up`.
# Publishes ports on localhost only, enables hot reload, mounts source code.
services:
  neo4j:
    ports:
      - "127.0.0.1:7474:7474"   # Browser UI
      - "127.0.0.1:7687:7687"   # Bolt

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC

  backend:
    environment:
      APP_ENV: development
      LOG_FORMAT: text
      PROMETHEUS_MULTIPROC_DIR: ""   # single process with --reload
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/srv/zync/backend
      - ./data:/srv/zync/data:ro

  frontend:
    build:
      target: dev
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
