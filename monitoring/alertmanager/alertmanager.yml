# __SLACK_WEBHOOK_URL__ is replaced at startup by entrypoint.sh from
# ALERT_SLACK_WEBHOOK_URL. Discord also works: use its webhook URL + "/slack".
route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="none"]
      receiver: "null"
    - matchers: [severity="critical"]
      receiver: slack
      repeat_interval: 1h

# Don't send "service down" warnings when a critical outage already explains them
inhibit_rules:
  - source_matchers: [alertname="PublicEndpointDown"]
    target_matchers: [severity="warning"]
  - source_matchers: [alertname="BackendNotReady"]
    target_matchers: [alertname=~"PostgresDown|ScrapeTargetDown"]

receivers:
  - name: "null"
  - name: slack
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ with .Annotations.description }}{{ . }}{{ end }}
          {{ end }}
