global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: zync
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── Application ────────────────────────────────────────────────────────────
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Synthetic probes (blackbox exporter) ───────────────────────────────────
  # Internal: is every dependency reachable? Public: does the real URL work,
  # and when does its TLS certificate expire?
  - job_name: probe-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:8000/ready"]
        labels: { probe: backend-ready }
      - targets: ["http://frontend:8080/healthz"]
        labels: { probe: frontend }
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: probe-public
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/prometheus/targets/public.json]
    relabel_configs: *blackbox_relabel

  # ── Infrastructure ─────────────────────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only containers that belong to a compose service
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  # ── Monitoring stack itself ────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
