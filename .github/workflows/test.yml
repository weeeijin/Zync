name: "Test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened]
  
# tell the workflow to run on the latest version of Ubuntu and use a specific container image for Python 3.12
jobs:
  test:
    runs-on: ubuntu-latest
    container: astral/uv:python3.12-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Dependency
        run: uv sync
      - name: Test
        run: uv run pytest tests/