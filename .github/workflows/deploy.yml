name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Never run two deploys against the same server at once
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload application files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          source: "backend,frontend,data/known_cases,data/lixiviant_kb,data/validation,data/sample_deposits,deploy,docker-compose.yml,docker-compose.prod.yml,.dockerignore"
          target: "/home/ubuntu/Zync"

      - name: Rebuild, restart and smoke test
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: IMAGE_TAG
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /home/ubuntu/Zync
            test -f .env || { echo "Missing /home/ubuntu/Zync/.env — see .env.example"; exit 1; }

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            export IMAGE_TAG
            $COMPOSE up -d --build --remove-orphans --wait --wait-timeout 300

            # Readiness: backend must reach Neo4j, Postgres and Qdrant
            $COMPOSE exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10).read().decode())"

            docker image prune -f
