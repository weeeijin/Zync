name: Deploy

# Release:   git tag v1.2.3 && git push origin v1.2.3
#            → tests → build/scan/publish images → deploy → smoke test
#            → automatic rollback to the previous version if the smoke test fails
# Rollback / redeploy: Actions → Deploy → Run workflow → version: v1.2.2
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to deploy (e.g. v1.2.2)"
        required: true

permissions:
  contents: read

# Never run two deploys against the same server at once
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  images:
    name: Images
    if: github.event_name == 'push'
    needs: test
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write

  deploy:
    name: Deploy to production
    needs: [test, images]
    # Run after a successful build, or directly for a manual redeploy/rollback
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.images.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # OIDC → short-lived AWS credentials, no stored AWS keys
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          echo "image_tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}

      # ── Temporarily allow SSH from this runner only (needs infra/github_oidc.tf) ──
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-5' }}

      - name: Open SSH for this runner's IP
        id: ssh_open
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        env:
          SG_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "::add-mask::$RUNNER_IP"
          RULE_ID=$(aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=gha-deploy-${{ github.run_id }}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      # Only runtime config goes to the server — code ships inside the images
      - name: Upload compose and proxy config
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker-compose.monitoring.yml,deploy,monitoring"
          target: "/home/ubuntu/Zync"

      - name: Pull images, roll out, smoke test (auto-rollback on failure)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          # Optional: the whole production .env, base64-encoded, stored as a
          # secret of the "production" environment (infra/demo/connect-github.sh)
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN,IMAGE_PREFIX,PROD_ENV_B64
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /home/ubuntu/Zync
            if [ -n "${PROD_ENV_B64:-}" ]; then
              # Secrets live in GitHub; the server copy is rewritten each deploy
              ( umask 077; printf '%s' "$PROD_ENV_B64" | base64 -d > .env.new ) && mv .env.new .env
            fi
            test -f .env || { echo "Missing /home/ubuntu/Zync/.env — set PROD_ENV_B64 or create it from .env.example"; exit 1; }

            export BACKEND_IMAGE="$IMAGE_PREFIX/zync-backend"
            export FRONTEND_IMAGE="$IMAGE_PREFIX/zync-frontend"
            compose() { docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml "$@"; }

            rollout() {
              IMAGE_TAG="$1" compose pull --quiet &&
              IMAGE_TAG="$1" compose up -d --no-build --remove-orphans --wait --wait-timeout 300
            }
            smoke_test() {
              IMAGE_TAG="$1" compose exec -T backend python -c \
                "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10).read().decode())"
            }

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            PREVIOUS="$(cat .deployed_version 2>/dev/null || true)"
            echo "Deploying $IMAGE_TAG (previous: ${PREVIOUS:-none})"

            if rollout "$IMAGE_TAG" && smoke_test "$IMAGE_TAG"; then
              echo "$IMAGE_TAG" > .deployed_version
              echo "$(date -u +%FT%TZ) $IMAGE_TAG" >> .deploy_history
              docker image prune -f >/dev/null
              echo "✅ Deployed $IMAGE_TAG"
            else
              echo "❌ $IMAGE_TAG failed health checks"
              compose logs --tail=100 backend || true
              if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$IMAGE_TAG" ]; then
                echo "↩️  Rolling back to $PREVIOUS"
                rollout "$PREVIOUS" && smoke_test "$PREVIOUS"
              fi
              exit 1
            fi

      - name: Close SSH for this runner
        if: always() && steps.ssh_open.outputs.rule_id != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ vars.AWS_SECURITY_GROUP_ID }}" \
            --security-group-rule-ids "${{ steps.ssh_open.outputs.rule_id }}"

      - name: External smoke test
        if: vars.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 10); do
            curl -fsS --max-time 10 "${{ vars.PUBLIC_URL }}/ready" && exit 0
            sleep 6
          done
          echo "Public endpoint did not become ready"; exit 1
