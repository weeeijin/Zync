name : "Deploy"

on:
    push:
        branches:
            - main
        tags: #not every push trigger this, only with "version" tag will trigger this 
            - 'v*.*.*'

jobs:
    Deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Upload 
              uses: appleboy/scp-action@v1
              with: 
                host: 
                username: 
                key: 
            - name: Start Service
              uses: appleboy/ssh-action@v1
              with:
                host: 
                username: 
                key: 
                script: |
                  cd /home/ubuntu/Zync
                  docker compose down
                  docker compose pull
                  docker compose up -d
                  python main.py
            