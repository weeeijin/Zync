# Non-secret settings shared by the backend. Secrets live in zync-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zync-config
  namespace: zync
data:
  APP_ENV: production
  GLM_MODEL: glm-4-flash
  # The browser reaches everything through the gateway on one origin
  CORS_ORIGINS: http://localhost:8088
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  POSTGRES_USER: zync
  POSTGRES_DB: zync
