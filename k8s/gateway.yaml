# Caddy gateway: the single entry point. Routes /api/* to the backend and
# everything else to the frontend, like Caddy does in docker-compose.prod.yml.
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  # NodePort exposes the Service on every node at port 30080; kind-config.yaml
  # maps that to http://localhost:8088. In the cloud this would be a
  # LoadBalancer Service or an Ingress/Gateway instead.
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # The caddy binary carries this file capability; if it's missing
              # from the container, the kernel refuses to exec it at all
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: caddyfile
          configMap:
            name: gateway-caddyfile
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
