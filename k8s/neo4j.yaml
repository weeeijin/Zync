# Neo4j: knowledge graph (Agent 1).
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5.18
          ports:
            - containerPort: 7687
            - containerPort: 7474
          env:
            # Not named NEO4J_*: the image turns every NEO4J_* variable into a
            # neo4j.conf setting, and "PASSWORD" isn't one (it refuses to start)
            - name: GRAPH_PASSWORD
              valueFrom:
                secretKeyRef: { name: zync-secrets, key: NEO4J_PASSWORD }
            # $(GRAPH_PASSWORD) is expanded by Kubernetes from the variable above
            - name: NEO4J_AUTH
              value: neo4j/$(GRAPH_PASSWORD)
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            # Keep the JVM inside the container's memory limit
            - name: NEO4J_server_memory_heap_initial__size
              value: 512m
            - name: NEO4J_server_memory_heap_max__size
              value: 512m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
          # Neo4j is slow to boot (and downloads APOC on first start):
          # the startup probe gives it up to 5 minutes before liveness applies
          startupProbe:
            tcpSocket: { port: 7687 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 7687 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 7687 }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
