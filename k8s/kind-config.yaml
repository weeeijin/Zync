# Local Kubernetes cluster (kind = "Kubernetes IN Docker").
# One node is enough for learning. Port 30080 on the node (the gateway's
# NodePort) is published to http://localhost:8088 on your machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
